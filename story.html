<!doctype html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="description" content="Experiencia narrativa rizomática de ¿VECI? — Ciudades Expandidas, desarrollada con HTML, CSS y JavaScript." />
  <title>Recorrido — ¿VECI?</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Archivo+Black&family=DM+Mono:wght@400;500&family=DM+Sans:opsz,wght@9..40,400;9..40,500;9..40,700&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@photo-sphere-viewer/core/index.min.css" />
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@photo-sphere-viewer/video-plugin/index.min.css" />
  <link rel="stylesheet" href="css/styles.css" />
</head>
<body class="story-page">
  <header class="story-topbar">
    <a href="index.html" class="story-brand" aria-label="Volver al mapa"><strong>¿VECI?</strong><span>Ciudades expandidas</span></a>
    <div class="story-location" id="story-location"><span>Recorrido en curso</span></div>
  </header>

  <main class="story-stage">
    <aside class="story-rail" aria-label="Estado del recorrido">
      <p class="eyebrow">Recorrido rizomático</p>
      <div class="story-rail__counter"><strong id="visited-count">01</strong><span>puntos<br />vistos</span></div>
      <button id="toggle-trail" class="rail-button" type="button">Ver huella</button>
      <a class="rail-link" href="index.html">← Volver al mapa</a>
    </aside>

    <section class="passage-shell" aria-live="polite">
      <div class="passage-meta"><span id="passage-tag">NARRATIVA</span><span id="passage-id">PUNTO_ELEGIDO</span></div>
      <article id="passage" class="passage"></article>
    </section>
  </main>

  <dialog id="trail-dialog" class="trail-dialog">
    <form method="dialog" class="trail-dialog__head"><div><p class="eyebrow">Tu huella</p><h2>Los puntos que tocaste.</h2></div><button value="close" aria-label="Cerrar">×</button></form>
    <ol id="trail-list" class="trail-list"></ol>
  </dialog>

  <noscript><p class="noscript">Esta experiencia necesita JavaScript para recorrer los nodos narrativos.</p></noscript>
  <script src="js/story-data.js"></script>
  <script type="importmap">
    {
      "imports": {
        "three": "https://cdn.jsdelivr.net/npm/three/build/three.module.js",
        "@photo-sphere-viewer/core": "https://cdn.jsdelivr.net/npm/@photo-sphere-viewer/core/index.module.js",
        "@photo-sphere-viewer/cubemap-video-adapter": "https://cdn.jsdelivr.net/npm/@photo-sphere-viewer/cubemap-video-adapter/index.module.js",
        "@photo-sphere-viewer/equirectangular-video-adapter": "https://cdn.jsdelivr.net/npm/@photo-sphere-viewer/equirectangular-video-adapter/index.module.js",
        "@photo-sphere-viewer/video-plugin": "https://cdn.jsdelivr.net/npm/@photo-sphere-viewer/video-plugin/index.module.js"
      }
    }
  </script>
  <script type="module" src="js/story-engine.js"></script>
</body>
</html>
